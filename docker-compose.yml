services:

  mysql:
    image: mysql:8.4

    environment:
      MYSQL_ROOT_PASSWORD: campus_root_password
      MYSQL_DATABASE: campus_food_intelligence

    ports:
      - "3307:3306"

    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql


  api:
    build: .

    depends_on:
      - mysql

    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: campus_food_intelligence
      DB_USER: root
      DB_PASSWORD: campus_root_password

    ports:
      - "8000:8000"

    command:
      [
        "uvicorn",
        "api.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]


  dashboard:
    build: .

    depends_on:
      - api

    environment:
      API_URL: http://api:8000

    ports:
      - "8501:8501"

    command:
      [
        "streamlit",
        "run",
        "dashboard/app.py",
        "--server.address=0.0.0.0",
        "--server.port=8501"
      ]


volumes:
  mysql_data: